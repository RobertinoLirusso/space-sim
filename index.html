<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Space Simulation</title>
  </head>
<body>
  <div id="threejs-wrapper"></div>
  <canvas id="sim-canvas"></canvas>
<div id="loading-overlay">
  <div class="spinner"></div>
  <div class="load-text">
    <span>Starting simulation</span>
    <span id="load-pct">0%</span>
  </div>
  <div id="controls-hint">
    <div class="keys">
      <kbd>↑</kbd>
      <kbd>←</kbd>
      <kbd>↓</kbd>
      <kbd>→</kbd>
    </div>
    <ul class="hint-list">
      <li><kbd>↑</kbd> Move forward</li>
      <li><kbd>↓</kbd> Move backward</li>
      <li><kbd>←</kbd><kbd>→</kbd> Move left / right</li>
    </ul>
  </div>
</div>
<div id="warp-fade"></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
